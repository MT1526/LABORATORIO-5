<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes - Informática y Multimedia</title>
    <style>
        /* Estilos generales del cuerpo de la página */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            padding: 20px; 
        }

        /* Estilo del título principal */
        h1 { 
            text-align: center; 
            color: #0056b3; 
        }
        
        /* Contenedor principal que usa Grid para organizar las tarjetas de forma responsiva */
        #contenedor-estudiantes {
            display: grid;
            /* Crea columnas automáticas de mínimo 250px según el ancho de pantalla */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Diseño de cada tarjeta individual de estudiante */
        .tarjeta {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Sombra ligera para dar profundidad */
            border-left: 5px solid #0056b3; /* Acento de color lateral */
        }

        /* Tipografía dentro de las tarjetas */
        .tarjeta h3 { margin-top: 0; color: #333; }
        .tarjeta p { margin: 5px 0; font-size: 0.9em; color: #666; }
        .etiqueta { font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <h1>Lista de Estudiantes</h1>
    
    <!-- Este div vacío se llenará dinámicamente con JavaScript -->
    <div id="contenedor-estudiantes"></div>

    <script>
        /**
         * Función asíncrona para obtener datos de un archivo JSON externo
         * y renderizarlos en el DOM.
         */
        async function cargarEstudiantes() {
            try {
                // 1. Petición al archivo local 'estudiantes.json'
                const respuesta = await fetch('estudiantes.json');
                
                // 2. Conversión de la respuesta a un objeto/array de JavaScript
                const datos = await respuesta.json();
                
                // 3. Referencia al elemento HTML donde insertaremos los datos
                const contenedor = document.getElementById('contenedor-estudiantes');

                // 4. Ciclo para procesar cada objeto del array 'datos'
                datos.forEach(estudiante => {
                    // Crear un nuevo elemento div para representar la tarjeta
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta';
                    
                    // Insertar el contenido HTML usando Template Literals (comillas invertidas)
                    // Se extraen las propiedades directamente del objeto 'estudiante'
                    tarjeta.innerHTML = `
                        <h3>${estudiante.nombre}</h3>
                        <p><span class="etiqueta">Carrera:</span> ${estudiante.carrera}</p>
                        <p><span class="etiqueta">Sede:</span> ${estudiante.sede}</p>
                        <p><span class="etiqueta">Email:</span> ${estudiante.correo}</p>
                    `;
                    
                    // Agregar la tarjeta recién creada al contenedor principal
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                // Manejo básico de errores (por si el archivo no existe o tiene formato inválido)
                console.error("Error al cargar el archivo JSON:", error);
            }
        }

        // Inicia el proceso de carga una vez que el script se lee
        cargarEstudiantes();
    </script>
</body>
</html>
