<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes - Informática y Multimedia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #0056b3; }
        
        /* Contenedor de las tarjetas */
        #contenedor-estudiantes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Estilo de cada tarjeta (Objeto) */
        .tarjeta {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-left: 5px solid #0056b3;
        }

        .tarjeta h3 { margin-top: 0; color: #333; }
        .tarjeta p { margin: 5px 0; font-size: 0.9em; color: #666; }
        .etiqueta { font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <h1>Lista de Estudiantes</h1>
    <div id="contenedor-estudiantes">
        </div>

    <script>
        // Función para leer el JSON
        async function cargarEstudiantes() {
            try {
                const respuesta = await fetch('estudiantes.json');
                const datos = await respuesta.json();
                const contenedor = document.getElementById('contenedor-estudiantes');

                // Recorremos cada objeto del JSON
                datos.forEach(estudiante => {
                    // Creamos el HTML para cada tarjeta
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta';
                    
                    tarjeta.innerHTML = `
                        <h3>${estudiante.nombre}</h3>
                        <p><span class="etiqueta">Carrera:</span> ${estudiante.carrera}</p>
                        <p><span class="etiqueta">Sede:</span> ${estudiante.sede}</p>
                        <p><span class="etiqueta">Email:</span> ${estudiante.correo}</p>
                    `;
                    
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                console.error("Error al cargar el archivo JSON:", error);
            }
        }

        // Ejecutar la función al abrir la página
        cargarEstudiantes();
    </script>
</body>
</html>
